<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Check-lists SMUR (prototype)</title>
</head>
<body>
  <header>
    <h1>Check-lists SMUR</h1>
    <p class="avertissement">Prototype</p>
    <p id="utilisateur" hidden>
      <span id="nom-utilisateur"></span>
      <button id="deconnexion" type="button" class="lien">Se déconnecter</button>
    </p>
  </header>

  <main>
    <form id="ecran-connexion" class="connexion">
      <label for="identifiant">Nom et prénom</label>
      <input id="identifiant" autocomplete="username" placeholder="NOM Prénom" required>
      <label for="code">Code personnel</label>
      <input id="code" type="password" autocomplete="current-password" autocapitalize="characters" required>
      <button type="submit">Se connecter</button>
      <p id="erreur-connexion" role="alert"></p>
    </form>

    <section id="ecran-checklist" hidden>
      <label for="liste">Liste</label>
      <select id="liste">
        <option value="ambulancier">Ambulancier</option>
        <option value="iade">IADE</option>
      </select>

      <ul id="items" class="items"></ul>

      <button id="enregistrer" type="button">Enregistrer</button>
      <p id="statut" role="status"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
